name: Deploy dia-XX-formulario-completo to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: dia-XX-formulario-completo

      - name: Build
        run: npm run build
        working-directory: dia-XX-formulario-completo

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dia-XX-formulario-completo/dist
          token: ${{ secrets.GITHUB_TOKEN }}
